name: CI

# Trigger the workflow on push or pull request, but only for the master branch
on:
  pull_request:
  push:
    branches: [master]

jobs:
  cabal:
    name: ${{ matrix.os }} / ghc ${{ matrix.ghc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: 
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-26-intel
          - windows-latest
        cabal:
          - "3.14"
        ghc:
          - "9.2"
          - "9.12"

    steps:
    - uses: actions/checkout@v2
      if: github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.ref == 'refs/heads/master'

    - uses: haskell-actions/setup@v2
      id: setup-haskell-cabal
      name: Setup Haskell
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: ${{ matrix.cabal }}

    - name: Configure
      run: cabal configure -O0 --enable-tests --enable-benchmarks --test-show-details=direct

    - name: Freeze
      run: cabal freeze

    - uses: actions/cache@v3
      name: Cache ~/.cabal/store
      with:
        path: ${{ steps.setup-haskell-cabal.outputs.cabal-store }}
        key: ${{ runner.os }}-${{ matrix.ghc }}-${{ hashFiles('cabal.project.freeze') }}

    - name: Build
      run: cabal build all

    - name: Set up Docker
      if: runner.os == 'macOS'
      uses: docker/setup-docker-action@v5

    - name: Test
      # Windows-native GHC cannot run Linux containers via the Windows Docker
      # Engine. Tests on Windows run in a separate windows-wsl2 job below.
      if: runner.os != 'Windows'
      run: |
        cabal test all

  stack:
    name: stack / ghc ${{ matrix.ghc }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: ["2.7.5"]
        ghc: ["9.0.2"]

    steps:
    - uses: actions/checkout@v2
      if: github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.ref == 'refs/heads/master'

    - uses: haskell-actions/setup@v2.6.1
      name: Setup Haskell Stack
      with:
        ghc-version: ${{ matrix.ghc }}
        stack-version: ${{ matrix.stack }}

    - uses: actions/cache@v3
      name: Cache ~/.stack
      with:
        path: ~/.stack
        key: ${{ runner.os }}-${{ matrix.ghc }}-stack

    - name: Build
      run: |
        stack build --system-ghc --test --bench --no-run-tests --no-run-benchmarks

    - name: Test
      run: |
        stack test --system-ghc

  windows-wsl2:
    name: windows-wsl2 / ghc ${{ matrix.ghc }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        ghc:
          - "9.12"

    defaults:
      run:
        shell: wsl-bash {0}

    steps:
    - uses: actions/checkout@v2
      if: github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.ref == 'refs/heads/master'

    - uses: Vampire/setup-wsl@v3
      with:
        distribution: Ubuntu-24.04

    - name: Install Docker
      run: |
        curl -fsSL https://get.docker.com | sudo sh
        sudo service docker start

    - name: Install GHC and Cabal
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://get-ghcup.haskell.org \
          | BOOTSTRAP_HASKELL_NONINTERACTIVE=1 sh
        source ~/.ghcup/env
        ghcup install ghc ${{ matrix.ghc }} --set
        ghcup install cabal 3.14 --set

    - name: Configure
      run: |
        source ~/.ghcup/env
        cabal configure -O0 --enable-tests --enable-benchmarks --test-show-details=direct

    - name: Freeze
      run: |
        source ~/.ghcup/env
        cabal freeze

    - name: Build
      run: |
        source ~/.ghcup/env
        cabal build all

    - name: Test
      run: |
        source ~/.ghcup/env
        cabal test all
